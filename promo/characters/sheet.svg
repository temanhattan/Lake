  <text class="label" x="80" y="72">RIPPLE · expressions</text>
  <text class="small" x="80" y="105">round, useful, slightly wobbly</text>
  <g transform="translate(100 190)"><use href="#ripple-base"/><text class="label" y="190">neutral</text></g>
  <g transform="translate(350 190)"><use href="#ripple-base"/><path class="ink" d="M72 85 Q85 104 100 84"/><text class="label" y="190">happy</text></g>
