[build-system]
requires = ["setuptools>=75.0,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-local"
version = "0.1.0"
description = "Private, local-first gallery for AI chats"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.2.6",
  "mcp==1.30.0",
  "pydantic==2.14.2",
]

[project.scripts]
lake = "lake.__main__:main"

[tool.setuptools.packages.find]
include = ["lake*"]

[tool.setuptools.package-data]
lake = ["static/**/*"]
