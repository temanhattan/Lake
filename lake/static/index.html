<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lake</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><a class="brand" href="/">Lake</a><span>Private conversation library</span><button id="import-open" class="quiet">Import</button></header>
<main><section class="toolbar"><input id="search" type="search" placeholder="Search chats… (Ctrl/Cmd+K)" autofocus><select id="mode"><option value="hybrid" selected>Hybrid search</option><option value="keyword">Keyword</option><option value="semantic">Semantic</option></select><label class="check"><input type="checkbox" id="rerank"> Local rerank</label><select id="source"><option value="">All sources</option><option>chatgpt</option><option>claude</option><option>manual</option><option>other</option></select><select id="model"><option value="">All models</option></select><select id="project"><option value="">All projects</option></select><select id="tag"><option value="">All tags</option></select><input id="from" type="date" title="From date"><input id="to" type="date" title="To date"><select id="sort"><option value="relevance">Relevance</option><option value="newest">Newest</option><option value="oldest">Oldest</option></select><label class="check"><input type="checkbox" id="show-pinned"> Pinned</label><label class="check"><input type="checkbox" id="show-archived"> Archived</label></section>
<section id="embedding-panel" class="embedding-panel"><div><strong>Semantic index</strong><span id="embedding-label" class="muted">Checking local embedding progress…</span></div><progress id="embedding-progress" value="0" max="100"></progress><button id="retry-embeddings" class="quiet" hidden>Retry failed</button></section>
<section id="library"><div id="count" class="muted"></div><div id="results" class="cards"></div></section>
<section id="reader" hidden><button id="back" class="quiet">← Library</button><div id="chat"></div></section></main>
<dialog id="import-dialog"><form method="dialog"><button class="x">×</button><h2>Import conversations</h2><p>Choose export files or paste a transcript. Original content is kept as imported.</p><input id="files" type="file" multiple accept=".json,.md,.txt"><textarea id="paste" rows="7" placeholder="Or paste a transcript…"></textarea><button id="do-import" type="button" class="primary">Import</button><div id="import-report"></div></form></dialog>
<dialog id="context-dialog"><form method="dialog"><button class="x">×</button><h2>Continue from here</h2><div id="context-count" class="muted"></div><textarea id="context-text" rows="12" readonly></textarea><button id="copy-context" type="button" class="primary">Copy context</button></form></dialog>
<script src="/static/app.js" defer></script></body></html>
